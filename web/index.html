<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartMotor emulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SmartMotor emulator</h1>
    <div id="connection-status" class="status disconnected">disconnected</div>
  </header>

  <main>
    <section class="toolbar">
      <label>
        View
        <select id="view-mode">
          <option value="both" selected>Both</option>
          <option value="pixels">Pixels</option>
          <option value="text">Text</option>
          <option value="raw">Raw</option>
        </select>
      </label>
      <button id="copy-text" type="button">Copy text</button>
      <button id="boot" type="button">Boot myfavcolor</button>
    </section>

    <section id="viewer" class="both">
      <section id="oled-panel" class="panel">
        <h2>OLED pixels</h2>
        <canvas id="oled" width="512" height="256"></canvas>
      </section>

      <section id="text-panel" class="panel">
        <h2>OLED text</h2>
        <pre id="screen-text"></pre>
      </section>

      <section id="raw-panel" class="panel">
        <h2>Raw frame</h2>
        <pre id="raw-frame"></pre>
      </section>
    </section>

    <section class="history">
      <button id="prev-frame" type="button">[ previous</button>
      <input id="frame-scrub" type="range" min="0" max="0" value="0">
      <button id="next-frame" type="button">] next</button>
      <span id="frame-count">0 frames</span>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
