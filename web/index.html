<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SmartMotor session replay</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
  #layout { display: flex; gap: 30px; align-items: flex-start; }
  #oled-wrap { text-align: center; }
  canvas#oled { background: #001; border: 4px solid #333; image-rendering: pixelated; }
  #arm-wrap { text-align: center; }
  #arm-dial { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #555;
              position: relative; background: #222; }
  #arm-needle { position: absolute; left: 50%; top: 50%; width: 4px; height: 60px;
                background: #4caf50; transform-origin: top center;
                transform: translate(-50%, 0) rotate(0deg); transition: transform 0.15s linear; }
  #status-panel { min-width: 260px; }
  .stat { margin: 6px 0; padding: 6px 10px; border-radius: 4px; background: #262626; }
  .stat b { color: #9cf; }
  #usb-badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-weight: bold; }
  .usb-on { background: #2e7d32; color: #fff; }
  .usb-off { background: #616161; color: #ddd; }
  #pot-bar-track { width: 200px; height: 10px; background: #333; border-radius: 5px; margin-top: 4px; }
  #pot-bar-fill { width: 0%; height: 100%; background: #4fc3f7; border-radius: 5px; transition: width 0.1s linear; }
  .btn-box { display: inline-block; padding: 3px 8px; margin-right: 4px; border-radius: 4px;
             background: #444; color: #999; font-size: 12px; font-weight: bold; transition: all 0.05s; }
  .btn-box.pressed { background: #fdd835; color: #000; }
  #controls { margin-top: 16px; }
  #scrub { width: 500px; }
  #log { margin-top: 20px; max-height: 220px; overflow-y: auto; background: #111;
         padding: 10px; border-radius: 4px; font-family: monospace; font-size: 13px; }
  #log div.hi { color: #ffca28; }
  button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 14px;
           border-radius: 4px; cursor: pointer; margin-right: 6px; }
  button:hover { background: #444; }
</style>
</head>
<body>
<h2>SmartMotor session replay</h2>
<div id="layout">
  <div id="oled-wrap">
    <canvas id="oled" width="512" height="256"></canvas>
    <div>OLED (128x64, real pixel data)</div>
  </div>
  <div id="arm-wrap">
    <div id="arm-dial"><div id="arm-needle"></div></div>
    <div>servo arm</div>
  </div>
  <div id="status-panel">
    <div class="stat">USB: <span id="usb-badge" class="usb-off">unknown</span></div>
    <div class="stat">Battery: <b id="batt-v">--</b> V</div>
    <div class="stat">Pot: <b id="pot-v">--</b>
      <div id="pot-bar-track"><div id="pot-bar-fill"></div></div>
    </div>
    <div class="stat">Buttons:
      <span id="btn-up" class="btn-box">UP</span>
      <span id="btn-down" class="btn-box">DOWN</span>
      <span id="btn-select" class="btn-box">SELECT</span>
    </div>
    <div class="stat">Accel: <b id="accel-v">--</b></div>
    <div class="stat">Orientation: <b id="orientation-v">--</b></div>
    <div class="stat">Color WB: <b id="color-wb-v">--</b></div>
    <div class="stat">Light: <b id="light-v">--</b></div>
    <div class="stat">t = <b id="t-v">0</b> ms</div>
  </div>
</div>
<div id="controls">
  <button id="play">Play</button>
  <button id="pause">Pause</button>
  <label>speed <select id="speed">
    <option value="1">1x</option>
    <option value="5" selected>5x</option>
    <option value="20">20x</option>
    <option value="50">50x</option>
  </select></label>
  <br><br>
  <input type="range" id="scrub" min="0" max="0" value="0">
</div>
<div id="log"></div>
<script src="app.js"></script>
</body>
</html>
