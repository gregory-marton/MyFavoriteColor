[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smotoremu"
version = "0.1.0"
description = "SmartMotor emulator and hardware-check tooling"
requires-python = ">=3.11"

[tool.setuptools]
packages = {find = {include = ["smotoremu*", "smcheck*"]}}
py-modules = ["smotor"]

[project.entry-points.pytest11]
smotoremu = "smotoremu.testing"
